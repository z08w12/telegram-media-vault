location = /telegram {
    return 301 /telegram/;
}

location /telegram/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:9292/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /telegram;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

location /_telegram_media/ {
    internal;
    alias /var/lib/telegram-media/media/;
    add_header Accept-Ranges bytes always;
    add_header Cache-Control "private, max-age=3600" always;
}

location /_telegram_thumbnails/ {
    internal;
    alias /var/lib/telegram-media/thumbnails/;
    add_header Cache-Control "private, max-age=86400" always;
}

